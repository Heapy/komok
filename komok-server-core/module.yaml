product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/serialization.module-template.yaml
  - //templates/runtime.module-template.yaml

dependencies:
  - org.http4k:http4k-server-netty:6.61.0.0
  - io.undertow:undertow-core:2.4.4.Final
  - $libs.kotomi.config
  - $libs.kotomi.config.dotenv
  - $libs.kotomi.utils.slf4j
  - $libs.kotomi.runtime
  - $libs.logback
  - $libs.kotlinx.coroutines.jdk8
  - $libs.kotlinx.serialization.json
  - $libs.netty: exported
  - $libs.netty.kqueue
  - $libs.netty.epoll
  - $libs.netty.iouring
  - $libs.junit.platform.launcher: runtime-only

test-dependencies:
  - $libs.junit.jupiter
  - $libs.kotlinx.coroutines.test
  - $libs.mockk
