name: Landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'docs/landing.md'
      - 'docs/features.md'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - 'docs/landing.md'
      - 'docs/features.md'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25'
          cache-dependency-path: 'landing/*.main.kts'
      - name: Build and check landing
        run: |
          kotlinr landing/build.main.kts
          kotlinr landing/check.main.kts
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: landing
          load: true
          tags: komok-landing:test
      - name: Check container HTTP responses
        run: bash landing/smoke-test.sh komok-landing:test
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish landing image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: landing
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/heapy/komok:landing-main
            ghcr.io/heapy/komok:landing-sha-${{ github.sha }}
