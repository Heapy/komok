name: "Build"
permissions:
    contents: read
on:
  - push
  - pull_request
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: "Validate Yarn Cache"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "yarn"
          cache-dependency-path: "frontend/yarn.lock"
      - run: yarn install --check-cache
        working-directory: frontend
  build-backend:
    name: "Build Backend Application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: "25"
          distribution: "corretto"
      - uses: gradle/actions/setup-gradle@v6
      - name: "Cache Kotlin/Native toolchain"
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: "konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}"
          restore-keys: "konan-${{ runner.os }}-"
      - run: ./gradlew check distTar
      - uses: actions/upload-artifact@v7
        with:
          name: "Backend Application"
          path: "komok-app/build/distributions/komok-app.tar"
          retention-days: 1
  build-frontend:
    name: "Build Frontend Application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "yarn"
          cache-dependency-path: "frontend/yarn.lock"
      - working-directory: frontend
        run: yarn install
      - working-directory: frontend
        run: yarn run build
      - uses: actions/upload-artifact@v7
        with:
          name: "Frontend Application"
          path: "frontend/dist/"
          retention-days: 1
  build-and-push-backend-image:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    needs:
      - build-backend
      - build-frontend
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: "Backend Application"
          path: "komok-app/build/distributions/"
      - name: "Untar files"
        run: mkdir -p komok-app/build/distributions && tar -xvf komok-app/build/distributions/komok-app.tar -C $_
      - uses: actions/download-artifact@v8
        with:
          name: "Frontend Application"
          path: "frontend/dist/"
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Login to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password:  ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: |
            ghcr.io/heapy/komok:main
            ghcr.io/heapy/komok:b${{ github.run_number }}
