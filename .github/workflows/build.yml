name: "Build"
permissions:
    contents: read
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-backend:
    name: "Build Backend Application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Heapy/setup-ktc@e0a603c477110083db0b44f302deb188d4991ea0 # v1.1.0
      - name: Read Kotomi revision
        id: kotomi
        run: echo "revision=$(cat kotomi.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Heapy/kotomi
          ref: ${{ steps.kotomi.outputs.revision }}
          path: .kotomi
      - name: Build pinned Kotomi dependencies
        working-directory: .kotomi
        run: |
          ./ktc-plugins sync
          ./ktc-plugins verify
          ./publish-local
      - name: "Restore locked build plugins"
        run: |
          ./ktc-plugins sync
          ./ktc-plugins verify
      - uses: Heapy/ktc-check@2f2dea35c8738d5c14446c56fe23da2d37aa1796 # v1.1.1
        with:
          platforms: jvm
      - run: ./kotlin 'do' distTar -m komok-app
      - uses: actions/upload-artifact@v7
        with:
          name: "Backend Application"
          path: "build/tasks/_komok-app_distTar@application/komok-app.tar"
          retention-days: 1
  build-and-push-backend-image:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    needs:
      - build-backend
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: "Backend Application"
          path: "komok-app/build/distributions/"
      - name: "Unpack backend distribution"
        run: tar -xf komok-app/build/distributions/komok-app.tar -C komok-app/build/distributions
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Login to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password:  ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: |
            ghcr.io/heapy/komok:main
            ghcr.io/heapy/komok:b${{ github.run_number }}
