name: "Build"
permissions:
    contents: read
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: "Validate Yarn Cache"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "yarn"
          cache-dependency-path: "frontend/yarn.lock"
      - run: yarn install --check-cache
        working-directory: frontend
  build-backend:
    name: "Build Backend Application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
      - name: "Restore locked build plugins"
        run: |
          ./ktc-plugins sync
          ./ktc-plugins verify
      - uses: Heapy/ktc-check@e86a342c115a59c2243c45b5a784e7003a372359 # v1.1.0
        with:
          platforms: jvm, linuxX64, wasmJs
      - run: ./kotlin 'do' distTar -m komok-app
      - uses: actions/upload-artifact@v7
        with:
          name: "Backend Application"
          path: "build/tasks/_komok-app_distTar@application/komok-app.tar"
          retention-days: 1
  check-native:
    name: "Check Native Library (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macosArm64
          - os: windows-latest
            platform: mingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
      - name: "Restore locked build plugins (Unix)"
        if: runner.os != 'Windows'
        run: |
          ./ktc-plugins sync
          ./ktc-plugins verify
      - name: "Restore locked build plugins (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./ktc-plugins.bat sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./ktc-plugins.bat verify
      - uses: Heapy/ktc-check@e86a342c115a59c2243c45b5a784e7003a372359 # v1.1.0
        with:
          modules: komok-tech-to-be-injected
          platforms: ${{ matrix.platform }}
  build-frontend:
    name: "Build Frontend Application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "yarn"
          cache-dependency-path: "frontend/yarn.lock"
      - working-directory: frontend
        run: yarn install
      - working-directory: frontend
        run: yarn run build
      - uses: actions/upload-artifact@v7
        with:
          name: "Frontend Application"
          path: "frontend/dist/"
          retention-days: 1
  build-and-push-backend-image:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    needs:
      - build-backend
      - build-frontend
      - check-native
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: "Backend Application"
          path: "komok-app/build/distributions/"
      - name: "Unpack backend distribution"
        run: tar -xf komok-app/build/distributions/komok-app.tar -C komok-app/build/distributions
      - uses: actions/download-artifact@v8
        with:
          name: "Frontend Application"
          path: "frontend/dist/"
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Login to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password:  ${{ secrets.GITHUB_TOKEN }}
      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: |
            ghcr.io/heapy/komok:main
            ghcr.io/heapy/komok:b${{ github.run_number }}
