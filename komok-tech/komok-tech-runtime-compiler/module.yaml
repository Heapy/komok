product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/publishing.module-template.yaml

description: Kotlin FIR and IR compiler plugin for Komok runtime

dependencies:
  - $libs.kotlin.compiler: compile-only

test-dependencies:
  - //komok-tech/komok-tech-runtime
  - $libs.kotlin.compiler
  - $libs.junit.jupiter
  - $libs.junit.platform.launcher: runtime-only

settings:
  kotlin:
    optIns:
      - org.jetbrains.kotlin.compiler.plugin.ExperimentalCompilerApi
      - org.jetbrains.kotlin.ir.symbols.UnsafeDuringIrConstructionAPI
  publishing:
    pom:
      name: Komok Tech Runtime Compiler Plugin
