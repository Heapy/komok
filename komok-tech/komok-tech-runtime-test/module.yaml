product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/runtime.module-template.yaml

dependencies:
  - //komok-tech/komok-tech-runtime-test-wrapper
  - //komok-tech/komok-tech-runtime
  - //komok-tech/komok-tech-runtime-wrappers
  - //komok-tech/komok-tech-time

test-dependencies:
  - $libs.junit.jupiter
  - $libs.kotlinx.coroutines.test
  - $libs.junit.platform.launcher: runtime-only

settings:
  kotlin:
    allOpen:
      enabled: true
      annotations: [io.heapy.komok.tech.runtime.Module]
    ksp:
      processors:
        - //komok-tech/komok-tech-runtime-test-wrapper
      processorOptions:
        komok.providers.module: io.heapy.komok.tech.runtime.services.AppServices
