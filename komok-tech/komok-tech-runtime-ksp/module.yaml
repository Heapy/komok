product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/publishing.module-template.yaml

description: KSP processor generating Komok runtime graph code

# The wrapper SPI exposes KotlinPoet and KSP types to plugin authors.
dependencies:
  - $libs.kotlinpoet.ksp: exported
  - $libs.ksp: exported

test-dependencies:
  - $libs.junit.jupiter
  - $libs.junit.platform.launcher: runtime-only

settings:
  publishing:
    pom:
      name: Komok Tech Runtime KSP Processor
