product:
  type: kmp/lib
  platforms: [jvm]

apply:
  - //templates/common.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "Coroutines-first dependency-injection runtime: graph, realm, fork"

dependencies:
  - $libs.kotlinx.coroutines.core: exported

test-dependencies@jvm:
  - //komok-tech/komok-tech-time
  - $libs.junit.jupiter
  - $libs.kotlinx.coroutines.test
  - $libs.junit.platform.launcher: runtime-only

settings:
  kotlin:
    freeCompilerArgs:
      - -Xexpect-actual-classes
  publishing:
    pom:
      name: Komok Tech Runtime
