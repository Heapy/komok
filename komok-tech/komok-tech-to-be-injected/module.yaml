    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected_test

settings@js:
  kotlin:
    freeCompilerArgs:
      - -Xir-module-name=io.heapy.komok:komok-tech-to-be-injected

settings@wasmJs:
