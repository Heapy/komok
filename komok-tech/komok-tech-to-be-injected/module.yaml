product:
  type: kmp/lib
  platforms:
    - jvm
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - linuxArm64
    - linuxX64
    - macosArm64
    - mingwX64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64

apply:
  - //templates/common.module-template.yaml
  - //templates/publishing.module-template.yaml

description: Library for dependency injection in Kotlin

dependencies@jvm:
  - $libs.slf4j.api

test-dependencies@jvm:
  - $libs.junit.jupiter
  - $libs.mockk
  - $libs.logback

settings:
  publishing:
    pom:
      name: Komok Tech To Be Injected

plugins:
  bcv:
    enabled: true
    # ktc-bcv does not yet recognize this target; it remains in the published library.
    excludedTargets: [watchosDeviceArm64]

# KTC 0.13 emits the removed -no-endorsed-libs option for shared Native metadata.
# Allow that toolchain warning in metadata; leaf compilations remain strict.
settings@native:
  kotlin:
    allWarningsAsErrors: false

# Preserve the library identity used by the existing Gradle-produced KLibs.
# Apply Native names at leaf targets so shared metadata fragments keep distinct names.
settings@iosArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@iosSimulatorArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@linuxArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@linuxX64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@macosArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@mingwX64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@tvosArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@tvosSimulatorArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@watchosArm64:
  kotlin:
    allWarningsAsErrors: true
    freeCompilerArgs:
      - -module-name=io.heapy.komok:komok-tech-to-be-injected

settings@watchosDeviceArm64:
