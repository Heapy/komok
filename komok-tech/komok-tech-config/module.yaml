product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/serialization.module-template.yaml
  - //templates/runtime.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "Configuration module based on .env and HOCON"

dependencies:
  - //komok-tech/komok-tech-config-dotenv: exported
  - //komok-tech/komok-tech-config-common: exported
  - //komok-tech/komok-tech-runtime
  - $libs.kotlinx.serialization.hocon: exported

settings:
  publishing:
    pom:
      name: "Komok Tech Config"

plugins:
  bcv: enabled
