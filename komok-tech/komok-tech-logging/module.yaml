product: jvm/lib

apply:
  - //templates/jvm.module-template.yaml
  - //templates/publishing.module-template.yaml

description: "Logging implementation: appenders, encoders, DSL, async, routing"

dependencies:
  - //komok-tech/komok-tech-logging-api: exported
  - $libs.kotlinx.coroutines.jdk8: exported
  - $libs.junit.platform.launcher: runtime-only

test-dependencies:
  - $libs.junit.jupiter
  - $libs.kotlinx.coroutines.test

settings:
  publishing:
    pom:
      name: "Komok Tech Logging"

plugins:
  bcv: enabled
